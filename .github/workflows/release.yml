name: Release

# 推送 v* 标签时,自动构建 Windows / macOS / Linux 桌面包 + Android APK,并发布到 GitHub Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: 桌面版(${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            glob: release/*.exe
          - os: macos-latest
            args: --mac
            glob: release/*.dmg
          - os: ubuntu-latest
            args: --linux
            glob: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建渲染层
        run: npm run build

      - name: 打包桌面应用
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm ci

      - name: 构建渲染层并同步到 Android
        run: |
          npm run build
          npx cap sync android

      - name: 构建 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.apk
